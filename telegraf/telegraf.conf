[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensor"]
  qos = 1
  connection_timeout = "30s"
  client_id = "telegraf"
  persistent_session = true

  name_override = "sensor_readings"
  data_format = "json"
  tag_keys = ["device_id", "state"]
  json_time_key = "time"
  json_time_format = "unix"

[[outputs.postgresql]]
  connection = "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
  schema = "public"
  tags_as_jsonb = false
  fields_as_jsonb = false
  timestamp_column_name = "time"
  timestamp_column_type = "timestamp with time zone"
  create_templates = [
    '''CREATE TABLE IF NOT EXISTS {{ .table }} ({{ .columns }})''',
  ]
